<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>vMix YouTube Embed Local</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1d2230;
      --text: #e8ecf1;
      --muted: #9aa4b2;
      --border: #2a3140;
      --accent: #4f8cff;
      --good: #19c37d;
      --shadow: 0 18px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(79,140,255,.16), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      -webkit-user-select: none;
      user-select: none;
    }

    .wrap {
      width: 100%;
      height: 100%;
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
    }

    .top {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)), var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-right: 6px;
      white-space: nowrap;
      letter-spacing: .2px;
    }

    input {
      flex: 1 1 360px;
      min-width: 220px;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(79,140,255,.8);
      box-shadow: 0 0 0 3px rgba(79,140,255,.12);
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .08s ease, opacity .18s ease, background .18s ease;
    }

    button:hover { opacity: .96; }
    button:active { transform: translateY(1px); }

    button.secondary { background: #2b3242; }
    button.good { background: var(--good); color: #04160d; }

    .hint {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)), var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      box-shadow: var(--shadow);
    }

    .player {
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      min-height: 320px;
      box-shadow: var(--shadow);
    }

    .player.fullscreen-ish {
      position: fixed;
      inset: 0;
      z-index: 999999;
      border-radius: 0;
      border: 0;
      box-shadow: none;
    }

    .doubleclick-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 26px;
      z-index: 3;
      background: rgba(0,0,0,.02);
      cursor: default;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      display: block;
    }

    .footer {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 2;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      backdrop-filter: blur(8px);
      pointer-events: none;
      max-width: calc(100% - 120px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dblhint {
      position: absolute;
      top: 6px;
      left: 14px;
      z-index: 2;
      color: rgba(255,255,255,.45);
      font-size: 11px;
      pointer-events: none;
    }

    .hidden-ui .top,
    .hidden-ui .hint {
      display: none;
    }

    .hidden-ui .wrap {
      grid-template-rows: 1fr;
      padding: 0;
      gap: 0;
    }

    .hidden-ui .player {
      border-radius: 0;
      border: 0;
      min-height: 100vh;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="top">
      <div class="title">YouTube local para vMix</div>
      <input id="url" placeholder="Pega un link completo, un ID o un video corto" />
      <button id="loadBtn" class="good">Cargar</button>
      <button class="secondary" id="muteBtn">Mutear</button>
      <button class="secondary" id="fsBtn">Pantalla</button>
    </div>

    <div class="hint">
      Formatos admitidos: <b>https://www.youtube.com/watch?v=ID</b>, <b>https://youtu.be/ID</b>, <b>https://www.youtube.com/shorts/ID</b> o solo el <b>ID</b>.
      En el reproductor, el doble clic funciona en la franja superior. La tecla <b>F</b> también agranda.
    </div>

    <div class="player" id="playerBox">
      <div class="doubleclick-bar" id="dblBar" title="Doble clic para agrandar"></div>

      <iframe
        id="player"
        src="about:blank"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen
        referrerpolicy="origin"
      ></iframe>

      <div class="dblhint">doble clic aquí para agrandar</div>
      <div class="footer" id="footerInfo">vMix YouTube Embed</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('url');
    const loadBtn = document.getElementById('loadBtn');
    const muteBtn = document.getElementById('muteBtn');
    const fsBtn = document.getElementById('fsBtn');
    const player = document.getElementById('player');
    const playerBox = document.getElementById('playerBox');
    const dblBar = document.getElementById('dblBar');
    const footerInfo = document.getElementById('footerInfo');

    let muted = true;
    let currentVideoId = '';
    let pseudoFullscreen = false;

    function safeDecode(text) {
      try {
        return decodeURIComponent(String(text || ''));
      } catch {
        return String(text || '');
      }
    }

    function extractVideoId(text) {
      const s = String(text || '').trim();
      if (!s) return null;

      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;

      const patterns = [
        /[?&]v=([a-zA-Z0-9_-]{11})/,
        /youtu\.be\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
        /youtube-nocookie\.com\/embed\/([a-zA-Z0-9_-]{11})/
      ];

      for (const re of patterns) {
        const m = s.match(re);
        if (m && m[1]) return m[1];
      }

      return null;
    }

    function buildEmbedUrl(videoId) {
      const params = new URLSearchParams({
        autoplay: '1',
        rel: '0',
        modestbranding: '1',
        playsinline: '1',
        enablejsapi: '1',
        fs: '1',
        iv_load_policy: '3',
        origin: window.location.origin
      });

      if (muted) {
        params.set('mute', '1');
      }

      return `https://www.youtube-nocookie.com/embed/${videoId}?${params.toString()}`;
    }

    function normalizeAddressBar(videoId) {
      const target = `?v=${encodeURIComponent(videoId)}`;
      try {
        history.replaceState(null, '', target);
      } catch (_) {}
    }

    function loadVideo(raw, fromAuto = false) {
      const id = extractVideoId(raw);
      if (!id) {
        footerInfo.textContent = 'No se pudo reconocer el video.';
        return;
      }

      currentVideoId = id;
      player.src = buildEmbedUrl(id);
      input.value = raw;
      localStorage.setItem('lastSource', raw.trim());
      localStorage.setItem('lastVideoId', id);
      normalizeAddressBar(id);

      footerInfo.textContent = `ID: ${id}`;
      if (!fromAuto) {
        setTimeout(() => {
          footerInfo.textContent = `ID: ${id} • listo`;
        }, 900);
      }
    }

    function getIncomingSource() {
      const qs = new URLSearchParams(window.location.search);
      const qv = qs.get('v');
      const qurl = qs.get('url');
      const qvideo = qs.get('video');
      const hash = safeDecode(window.location.hash || '').replace(/^#/, '');

      if (qv) return qv;
      if (qurl) return qurl;
      if (qvideo) return qvideo;
      if (hash) {
        const hashMatch = hash.match(/(?:v=|url=|video=)?(.+)/i);
        if (hashMatch && hashMatch[1]) return hashMatch[1];
      }

      const fullUrl = safeDecode(window.location.href || '');
      const fullUrlId = extractVideoId(fullUrl);
      if (fullUrlId) return fullUrl;

      const decodedPath = safeDecode(window.location.pathname || '').replace(/^\/+/, '');
      if (!decodedPath) return '';

      const parts = decodedPath.split('/');
      if (parts.length > 1) {
        const afterRepo = parts.slice(1).join('/');
        if (afterRepo) return afterRepo;
      }

      return decodedPath;
    }

    function toggleMute() {
      muted = !muted;
      muteBtn.textContent = muted ? 'Desmutear' : 'Mutear';

      const raw = input.value || localStorage.getItem('lastSource') || currentVideoId || '';
      if (raw) loadVideo(raw, true);
    }

    function requestPageFullscreen() {
      const el = playerBox;

      if (!document.fullscreenElement) {
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
          return;
        }
        if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
          return;
        }
        if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
          return;
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
          return;
        }
        if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
          return;
        }
        if (document.msExitFullscreen) {
          document.msExitFullscreen();
          return;
        }
      }

      pseudoFullscreen = !pseudoFullscreen;
      playerBox.classList.toggle('fullscreen-ish', pseudoFullscreen);
      document.body.classList.toggle('hidden-ui', pseudoFullscreen);
    }

    loadBtn.addEventListener('click', () => loadVideo(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadVideo(input.value);
    });

    muteBtn.addEventListener('click', toggleMute);
    fsBtn.addEventListener('click', requestPageFullscreen);

    dblBar.addEventListener('dblclick', (e) => {
      e.preventDefault();
      requestPageFullscreen();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (pseudoFullscreen) {
          pseudoFullscreen = false;
          playerBox.classList.remove('fullscreen-ish');
          document.body.classList.remove('hidden-ui');
        }
        if (document.fullscreenElement) {
          document.exitFullscreen?.();
        }
      }

      if (e.key === 'f' || e.key === 'F') {
        requestPageFullscreen();
      }
    });

    const autoSource =
      getIncomingSource() ||
      localStorage.getItem('lastSource') ||
      localStorage.getItem('lastVideoId') ||
      '2xBEBH8TJGk';

    input.value = autoSource;
    loadVideo(autoSource, true);

    muteBtn.textContent = muted ? 'Desmutear' : 'Mutear';
    footerInfo.textContent = window.location.hostname ? window.location.origin : 'local';
  </script>
</body>
</html>
